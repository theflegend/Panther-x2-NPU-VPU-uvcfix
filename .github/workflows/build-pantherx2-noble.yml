name: Build Panther X2 Noble BSP 6.1 Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified kernel tarballs to a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-pantherx2-noble.yml
      - armbian/**
      - README.md

concurrency:
  group: pantherx2-noble-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ARMBIAN_COMMIT: 70a242faa308c57be5ed636897dfee77de350773
  TZ: Asia/Shanghai

jobs:
  build:
    name: Panther X2 / Ubuntu 24.04 / BSP 6.1 / kernel only
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout firmware configuration
        uses: actions/checkout@v6

      - name: Audit Panther X2 inputs
        shell: bash
        run: |
          set -euo pipefail

          test -s armbian/config/boards/panther-x2-vendor.csc
          test -s armbian/userpatches/config-pantherx2-image.conf
          test -s armbian/userpatches/extensions/remove-armbian-apt-source.sh
          test -s armbian/userpatches/kernel/rk35xx-vendor-6.1/0001-arm64-dts-rockchip-add-panther-x2-bsp61-accel.patch
          test -s armbian/userpatches/kernel/rk35xx-vendor-6.1/0002-media-uvcvideo-undup-use-uvc-endpoint-max-bpi.patch
          test -s armbian/userpatches/kernel/rk35xx-vendor-6.1/0003-media-uvcvideo-fix-bandwidth-for-alcor.patch
          test -s armbian/userpatches/u-boot/u-boot-panther-x2-radxa/9999-fix-radxa-rock3-gcc-compat.patch

          grep -q '^BOARD=panther-x2-vendor$' armbian/userpatches/config-pantherx2-image.conf
          grep -q '^BRANCH=vendor$' armbian/userpatches/config-pantherx2-image.conf
          grep -q '^RELEASE=noble$' armbian/userpatches/config-pantherx2-image.conf
          grep -q '^ENABLE_EXTENSIONS="remove-armbian-apt-source"$' armbian/userpatches/config-pantherx2-image.conf
          grep -q '^function custom_apt_repo__remove_invalid_armbian_sources()' armbian/userpatches/extensions/remove-armbian-apt-source.sh
          grep -q '^function post_repo_customize_image__remove_invalid_armbian_sources()' armbian/userpatches/extensions/remove-armbian-apt-source.sh
          grep -q 'KERNELBRANCH="commit:5280f9b4336199c4025c8eed894d2b4e2268dcc6"' armbian/config/boards/panther-x2-vendor.csc
          grep -q 'BOOTBRANCH="commit:c55987146f4f9b20f7cb2f917ca88300419afe8d"' armbian/config/boards/panther-x2-vendor.csc
          grep -q 'BOOTPATCHDIR="u-boot-panther-x2-radxa"' armbian/config/boards/panther-x2-vendor.csc
          grep -q 'rk3566-panther-x2.dtb' armbian/userpatches/kernel/rk35xx-vendor-6.1/0001-arm64-dts-rockchip-add-panther-x2-bsp61-accel.patch
          grep -q 'rknpu-supply = <0x149>' armbian/userpatches/kernel/rk35xx-vendor-6.1/0001-arm64-dts-rockchip-add-panther-x2-bsp61-accel.patch
          grep -q 'interrupt-names = "npu_irq"' armbian/userpatches/kernel/rk35xx-vendor-6.1/0001-arm64-dts-rockchip-add-panther-x2-bsp61-accel.patch

          grep -q 'uvc_endpoint_max_bpi' armbian/userpatches/kernel/rk35xx-vendor-6.1/0002-media-uvcvideo-undup-use-uvc-endpoint-max-bpi.patch
          grep -q 'UVC non compliance' armbian/userpatches/kernel/rk35xx-vendor-6.1/0003-media-uvcvideo-fix-bandwidth-for-alcor.patch

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail

          docker image prune --all --force || true
          if [[ -n "${AGENT_TOOLSDIRECTORY:-}" ]]; then
            sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          fi
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -hT

      - name: Prepare ARM64 emulation
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes arch-test binfmt-support device-tree-compiler qemu-user-static rsync util-linux xz-utils
          sudo systemctl restart systemd-binfmt || true
          sudo update-binfmts --enable qemu-aarch64
          arch-test arm64

      - name: Fetch pinned Armbian build framework
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /builder
          sudo chown "$(id -u):$(id -g)" /builder

          git init /builder/build
          git -C /builder/build remote add origin https://github.com/armbian/build.git
          git -C /builder/build fetch --depth=1 origin "${ARMBIAN_COMMIT}"
          git -C /builder/build checkout --detach FETCH_HEAD
          test "$(git -C /builder/build rev-parse HEAD)" = "${ARMBIAN_COMMIT}"

          rsync -a "${GITHUB_WORKSPACE}/armbian/" /builder/build/
          ln -s /builder/build "${GITHUB_WORKSPACE}/armbian-build"

          git -C /builder/build status --short

      - name: Build kernel only
        working-directory: /builder/build
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail

          ./compile.sh \
            RELEASE=noble \
            KERNEL_ONLY=yes \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            EXPERT=yes \
            pantherx2-image kernel

      - name: Verify the generated kernel packages
        shell: bash
        run: |
          set -euo pipefail

          validation="${GITHUB_WORKSPACE}/pantherx2-kernel-validation.txt"
          exec > >(tee "${validation}") 2>&1

          debs_dir="/builder/build/output/debs"
          test -d "${debs_dir}"

          echo "=== Generated .deb packages ==="
          ls -lh "${debs_dir}"

          image_deb="$(ls "${debs_dir}"/linux-image-*.deb | head -1)"
          dtb_deb="$(ls "${debs_dir}"/linux-dtb-*.deb | head -1)"
          test -n "${image_deb}"
          test -n "${dtb_deb}"
          echo "image_deb=${image_deb}"
          echo "dtb_deb=${dtb_deb}"

          workdir="$(mktemp -d)"
          dpkg-deb -x "${image_deb}" "${workdir}"
          dpkg-deb -x "${dtb_deb}" "${workdir}"

          echo "=== Layout under ${workdir}/boot ==="
          find "${workdir}/boot" -maxdepth 3 -type f -o -type l | head -50
          echo "=== Search for dtb ==="
          find "${workdir}" -name 'rk3566-panther-x2.dtb'

          kernel_image="$(find "${workdir}/boot" -maxdepth 1 -name 'vmlinuz-*' -print -quit)"
          test -n "${kernel_image}"
          echo "kernel_image=${kernel_image}"

          if ! strings "${kernel_image}" | grep -q 'UVC non compliance'; then
            echo '::error title=Patch not applied::UVC bandwidth fix string not found in kernel image'
            exit 1
          fi
          echo 'OK: UVC bandwidth patch is present in kernel image'

          kernel_config="$(find "${workdir}/boot" -maxdepth 1 -name 'config-*' -print -quit)"
          test -n "${kernel_config}"

          require_line() {
            local path="$1"; local expression="$2"; local label="$3"
            if ! grep -Eq "${expression}" "${path}"; then
              echo "::error title=Kernel config mismatch::${label}"
              return 1
            fi
            echo "OK value: ${label}"
          }

          require_line "${kernel_config}" '^CONFIG_ROCKCHIP_MULTI_RGA=y$' 'RGA driver enabled'
          require_line "${kernel_config}" '^CONFIG_IEP=y$' 'IEP driver enabled'
          require_line "${kernel_config}" '^CONFIG_ROCKCHIP_MPP_SERVICE=y$' 'MPP service enabled'
          require_line "${kernel_config}" '^CONFIG_ROCKCHIP_MPP_RKVDEC2=y$' 'RKVDEC2 enabled'
          require_line "${kernel_config}" '^CONFIG_ROCKCHIP_MPP_RKVENC=y$' 'RKVENC enabled'
          require_line "${kernel_config}" '^CONFIG_ROCKCHIP_RKNPU=y$' 'RKNPU enabled'
          require_line "${kernel_config}" '^CONFIG_MEDIA_USB_SUPPORT=y$' 'USB media support enabled'
          require_line "${kernel_config}" '^CONFIG_USB_VIDEO_CLASS=y$' 'UVC camera driver enabled'
          require_line "${kernel_config}" '^CONFIG_USB_XHCI_HCD=y$' 'XHCI host driver enabled'
          require_line "${kernel_config}" '^CONFIG_USB_DWC3=y$' 'DWC3 controller driver enabled'

          dtb_file="$(find "${workdir}" -name 'rk3566-panther-x2.dtb' -print -quit)"
          test -n "${dtb_file}"
          echo "dtb_file=${dtb_file}"

          expect_fdt_status() {
            local node="$1"; local expected="$2"
            local actual
            actual="$(sudo fdtget -t s "${dtb_file}" "${node}" status 2>/dev/null || true)"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error title=DTB status mismatch::${node}: expected=${expected}, actual=${actual:-<missing>}"
              return 1
            fi
            echo "OK DTB status: ${node}=${actual}"
          }

          while IFS= read -r node; do
            expect_fdt_status "${node}" okay
          done <<'NODES'
          /mpp-srv
          /npu@fde40000
          /bus-npu
          /iommu@fde4b000
          /vdpu@fdea0400
          /iommu@fdea0800
          /rk_rga@fdeb0000
          /jpegd@fded0000
          /iommu@fded0480
          /vepu@fdee0000
          /iommu@fdee0800
          /iep@fdef0000
          /iommu@fdef0800
          /rkvenc@fdf40000
          /iommu@fdf40f00
          /rkvdec@fdf80200
          /iommu@fdf80800
          /usbdrd
          /usbdrd/usb@fcc00000
          /usb2-phy@fe8a0000
          /usb2-phy@fe8a0000/otg-port
          NODES

          echo 'Kernel package validation: passed'

      - name: Repack kernel debs as armbian-update tarballs
        shell: bash
        run: |
          set -euo pipefail

          debs_dir="/builder/build/output/debs"
          out_dir="/builder/build/output/kernel-tarballs"
          mkdir -p "${out_dir}"

          image_deb="$(ls "${debs_dir}"/linux-image-*.deb | head -1)"
          kver="$(basename "${image_deb}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          test -n "${kver}"
          echo "Kernel version: ${kver}"

          tmp="$(mktemp -d)"
          for f in "${debs_dir}"/*.deb; do
            dpkg-deb -x "${f}" "${tmp}"
          done

          echo "=== Layout after unpack ==="
          find "${tmp}" -maxdepth 3 -type d | sort | head -40

          # --- boot-*.tar.gz ---
          boot_files=()
          for name in Image vmlinuz-* config-* System.map-*; do
            while IFS= read -r -d '' f; do
              boot_files+=("${f}")
            done < <(find "${tmp}/boot" -maxdepth 1 -name "${name}" -print0 2>/dev/null)
          done
          if [[ ${#boot_files[@]} -eq 0 ]]; then
            echo "::error title=Missing boot files::No boot artifacts found"
            exit 1
          fi

          ( cd "${tmp}" && tar -czf "${out_dir}/boot-${kver}.tar.gz" \
              "${boot_files[@]#${tmp}/}" )

          # --- dtb-*.tar.gz ---
          dtb_root=""
          for cand in "${tmp}/boot/dtb" "${tmp}/boot/dtb-${kver}-vendor-rk35xx" \
                      "${tmp}/boot/dtb-${kver}"; do
            if [[ -d "${cand}" ]]; then
              dtb_root="${cand}"
              break
            fi
          done

          if [[ -z "${dtb_root}" ]]; then
            found="$(find "${tmp}" -name 'rk3566-panther-x2.dtb' -printf '%h\n' | head -1)"
            if [[ -n "${found}" ]]; then
              dtb_root="${found}"
            fi
          fi

          if [[ -z "${dtb_root}" ]]; then
            echo "::error title=Missing DTB directory::Cannot locate dtb files"
            exit 1
          fi
          echo "dtb_root=${dtb_root}"

          rel="${dtb_root#${tmp}/}"
          ( cd "${tmp}" && tar -czf "${out_dir}/dtb-${kver}.tar.gz" "${rel}" )

          # --- modules-*.tar.gz ---
          modules_root=""
          for cand in "${tmp}/lib/modules/${kver}" "${tmp}/lib/modules/${kver}-vendor-rk35xx"; do
            if [[ -d "${cand}" ]]; then
              modules_root="${cand}"
              break
            fi
          done
          if [[ -z "${modules_root}" ]]; then
            echo "::error title=Missing modules directory::Cannot locate /lib/modules/${kver}*"
            ls -la "${tmp}/lib/modules" || true
            exit 1
          fi
          echo "modules_root=${modules_root}"
          rel="${modules_root#${tmp}/}"
          ( cd "${tmp}" && tar -czf "${out_dir}/modules-${kver}.tar.gz" "${rel}" )

          # --- header-*.tar.gz ---
          if [[ -d "${tmp}/usr/src" ]]; then
            ( cd "${tmp}" && tar -czf "${out_dir}/header-${kver}.tar.gz" usr/src )
          fi

          rm -rf "${tmp}"

          echo "=== Final tarballs ==="
          ls -lh "${out_dir}"

          dtb_size="$(stat -c '%s' "${out_dir}/dtb-${kver}.tar.gz")"
          if [[ "${dtb_size}" -lt 1000 ]]; then
            echo "::error title=Invalid dtb tarball::dtb-${kver}.tar.gz is only ${dtb_size} bytes"
            exit 1
          fi
          echo "OK dtb tarball size=${dtb_size}"

      - name: Upload verified kernel tarballs
        uses: actions/upload-artifact@v4
        with:
          name: Panther-X2-Noble-BSP61-kernel-${{ github.run_number }}
          path: |
            /builder/build/output/kernel-tarballs/*.tar.gz
            pantherx2-kernel-validation.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload validation report and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panther-X2-build-logs-${{ github.run_number }}
          path: |
            /builder/build/output/logs/
            pantherx2-kernel-validation.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && (github.event_name == 'push' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="pantherx2-noble-kernel-${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" \
            /builder/build/output/kernel-tarballs/*.tar.gz \
            "${GITHUB_WORKSPACE}/pantherx2-kernel-validation.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Panther X2 Ubuntu 24.04 BSP 6.1 kernel ${GITHUB_RUN_NUMBER}" \
            --notes "Verified Panther X2 Noble kernel tarballs (armbian-update compatible) built from Armbian ${ARMBIAN_COMMIT} with UVC bandwidth fix backported."
